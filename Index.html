<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Week 4 | Job-Order Costing: Worked Solutions</title><style>
:root{--ink:#172435;--muted:#607085;--line:#dbe4ee;--blue:#2168c5;--pale:#eef5ff;--gold:#e9a83b;--bg:#f6f8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,Arial,sans-serif}header{background:#132b49;color:#fff;padding:36px max(24px,calc((100vw - 1120px)/2)) 28px}header h1{font-size:clamp(27px,4vw,42px);line-height:1.2;margin:0 0 12px}header p{margin:0;color:#c9d9ed;max-width:790px}.wrap{max-width:1120px;margin:auto;padding:28px 22px 70px}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:25px}.sidebar{position:sticky;top:18px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.sidebar strong{display:block;margin-bottom:10px}.nav{display:block;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:9px 10px;color:var(--ink);cursor:pointer;font:inherit;font-size:14px}.nav:hover,.nav.active{background:var(--pale);color:var(--blue)}main{min-width:0}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;margin-bottom:20px;box-shadow:0 3px 15px #15294308}.eyebrow{color:var(--blue);font-size:13px;font-weight:700;letter-spacing:.06em}h2{font-size:27px;line-height:1.3;margin:7px 0 10px}h3{font-size:19px;margin:24px 0 10px}p{margin:9px 0}.intro{color:var(--muted)}.tag{display:inline-block;background:#edf2f7;border-radius:999px;padding:3px 10px;font-size:12px;color:#4f6074;margin:4px 5px 4px 0}.topic{border-left:4px solid var(--blue);background:#f2f7fe;padding:12px 16px;margin:18px 0;border-radius:0 10px 10px 0}.topic small{display:block;color:#526b88}.question{background:#fafbfc;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:18px 0}.question b{color:#344861}.exercise{display:none}.exercise.active{display:block}.unit{border-top:1px solid var(--line);padding-top:20px;margin-top:24px}.unit:first-of-type{border-top:0}.unit-title{font-weight:750;font-size:18px}.progress{font-size:13px;color:var(--muted);margin:8px 0}.step{border:1px solid var(--line);border-radius:11px;margin:10px 0;padding:12px 16px;animation:fade .25s ease}.step .label{font-size:12px;letter-spacing:.04em;color:var(--blue);font-weight:800}.step p{margin:3px 0}.step.final{background:#eef8f2;border-color:#b9dfc5}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{cursor:pointer}button.primary,button.secondary{border-radius:9px;padding:8px 14px;font:inherit;font-size:14px}button.primary{background:var(--blue);color:white;border:1px solid var(--blue)}button.secondary{background:#fff;border:1px solid #b9c9db;color:#294c77}button:disabled{opacity:.45;cursor:not-allowed}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#f3f6fa;border-radius:6px;padding:2px 5px;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;margin:9px 0;font-size:14px}th,td{border-bottom:1px solid var(--line);text-align:right;padding:7px 8px}th:first-child,td:first-child{text-align:left}th{background:#f1f5fa}tr:last-child td{font-weight:700}.scroll{overflow-x:auto}.flow{display:flex;gap:5px;flex-wrap:wrap;margin:15px 0}.flow span{background:#eaf1f9;border-radius:8px;padding:5px 9px;font-size:13px}.flow i{font-style:normal;color:#789}.foot{font-size:13px;color:var(--muted);margin-top:28px}@keyframes fade{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:760px){.layout{display:block}.sidebar{position:static;margin-bottom:18px;display:flex;gap:5px;overflow-x:auto;align-items:center}.sidebar strong{display:none}.nav{white-space:nowrap;width:auto}.panel{padding:20px}header{padding:28px 22px}}
</style></head><body><header><h1>Week 4: E2-13 and P3-14</h1></header><div class="wrap"><div class="layout"><aside class="sidebar" id="nav"></aside><main id="main"></main></div><p class="foot">Based on E2-13 and P3-14 in Week 4.docx and slides 2–11 of Week_4.pptx. Amounts are in US dollars. Slides 10–11 only preview the cost schedules; their detailed calculations here come from the exercise and answer document.</p></div>
<script>
const data=[{"id":"2-13","name":"Exercise 2-13","title":"Seasonal volume and a stable annual rate","tags":["Fixed and variable overhead","Unit cost","Annual rate"],"source":"Slide 4: Estimate overhead as Y = a + bx, where a is fixed overhead, b is variable overhead per unit of the base, and x is activity. Predetermined overhead rate = estimated overhead ÷ estimated base activity. Slide 5: Apply the rate to production.","context":"Kingsport makes one product and estimates a separate plantwide overhead rate each quarter, using units produced as the allocation base. Variable manufacturing overhead is estimated at $2 per unit. The annual plan is:<div class=\"scroll\"><table><tr><th>Quarter</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><td>Estimated units</td><td>80,000</td><td>40,000</td><td>20,000</td><td>60,000</td></tr><tr><td>Direct materials</td><td>$240,000</td><td>$120,000</td><td>$60,000</td><td>$180,000</td></tr><tr><td>Direct labor</td><td>$128,000</td><td>$64,000</td><td>$32,000</td><td>$96,000</td></tr><tr><td>Estimated overhead</td><td>$300,000</td><td>$220,000</td><td>$180,000</td><td>Unknown</td></tr></table></div>The four questions ask for fixed overhead, quarter 4 unit cost, the cause of the quarterly variation, and a stabilizing rate.","units":[["1. What is fixed overhead per quarter?",[["Use the overhead formula","From slide 4, total overhead = fixed overhead + $2 × units. For quarter 1: $300,000 = fixed overhead + $2 × 80,000."],["Calculate the fixed portion","$300,000 − $160,000 = $140,000."],["Answer","Estimated fixed manufacturing overhead is $140,000 per quarter."]]],["2. Estimate quarter 4 unit product cost",[["Estimate quarter 4 overhead","$140,000 fixed + $2 × 60,000 units = $260,000."],["Calculate total and unit cost","($180,000 materials + $96,000 labor + $260,000 overhead) ÷ 60,000 units = $536,000 ÷ 60,000."],["Answer","Estimated unit product cost is $8.93, rounded to the nearest cent."]]],["3. Why does quarterly unit cost change?",[["Separate variable and fixed amounts","Materials $3 + labor $1.60 + variable overhead $2 = $6.60 per unit. Fixed overhead is $140,000 each quarter."],["Spread fixed overhead over output","Fixed overhead per unit = $140,000 ÷ quarterly units. For 80,000, 40,000, 20,000, and 60,000 units, it is $1.75, $3.50, $7.00, and about $2.33."],["Answer","Unit costs are $8.35, $10.10, $13.60, and $8.93. Fewer units mean more fixed overhead allocated to each unit."]]],["4. Recommend and compute a stable rate",[["Use annual estimates","Annual units = 80,000 + 40,000 + 20,000 + 60,000 = 200,000. Annual fixed overhead = $140,000 × 4 = $560,000."],["Calculate the annual rate","Estimated annual overhead = $560,000 + ($2 × 200,000) = $960,000. Rate = $960,000 ÷ 200,000 = $4.80 per unit."],["Apply the rate to each quarter","Applied overhead = units × $4.80: $384,000, $192,000, $96,000, and $288,000."],["Answer","Unit product cost is $3 materials + $1.60 labor + $4.80 overhead = $9.40 in every quarter."]]]]},{"id":"3-14","name":"Problem 3-14","title":"Allocate overhead using materials used","tags":["Materials used versus purchased","Underapplied overhead","WIP components"],"source":"Slide 4: Set the predetermined rate from estimates before the period; apply it to the chosen base. Slide 7: Compare actual with applied overhead at period end; underapplied overhead can be closed to COGS or allocated among WIP, Finished Goods, and COGS. Slides 10–11 name the cost schedules.","context":"Gitano applies overhead to jobs using the dollar value of direct materials USED in production. At the start of the year it estimated $800,000 overhead and $500,000 of direct materials used. This year: beginning raw materials $20,000, purchases $510,000, ending raw materials $80,000, direct labor $90,000; beginning/ending WIP $150,000/$70,000; beginning/ending Finished Goods $260,000/$400,000. Actual overhead: indirect labor $170,000, property taxes $48,000, equipment depreciation $260,000, maintenance $95,000, insurance $7,000, and building rent $180,000. Ending WIP includes $24,000 direct materials.","units":[["1. Compute the predetermined overhead rate",[["Choose the estimated base","The allocation base is direct materials USED in production. Estimated overhead is $800,000 and estimated materials used are $500,000."],["Answer","Predetermined overhead rate = $800,000 ÷ $500,000 = 160% of direct materials cost."]]],["2. Find the overhead application difference",[["Find materials used","$20,000 beginning Raw Materials + $510,000 purchases − $80,000 ending Raw Materials = $450,000 used."],["Apply overhead","$450,000 × 160% = $720,000 applied overhead."],["Sum actual overhead","$170,000 + $48,000 + $260,000 + $95,000 + $7,000 + $180,000 = $760,000."],["Answer","Actual $760,000 − applied $720,000 = $40,000 underapplied overhead."]]],["3. Prepare the cost of goods manufactured schedule",[["Find direct materials used","$20,000 beginning + $510,000 purchases − $80,000 ending = $450,000."],["Add manufacturing costs","$450,000 materials + $90,000 labor + $720,000 applied overhead = $1,260,000."],["Complete the WIP roll-forward","$150,000 beginning WIP + $1,260,000 costs added − $70,000 ending WIP."],["Answer","Cost of goods manufactured = $1,340,000."]]],["4. Find unadjusted COGS and describe disposal",[["Roll forward Finished Goods","$260,000 beginning Finished Goods + $1,340,000 cost of goods manufactured − $400,000 ending Finished Goods."],["Answer","Unadjusted cost of goods sold = $1,200,000. The $40,000 underapplied overhead can be closed to COGS or allocated among WIP, Finished Goods, and COGS based on applied overhead in their balances."]]],["5. Solve the missing ending-WIP components",[["Find overhead in ending WIP","$24,000 direct materials × 160% = $38,400 applied overhead."],["Solve for direct labor","$70,000 total ending WIP − $24,000 materials − $38,400 overhead = $7,600."],["Answer","Ending WIP consists of $24,000 materials, $7,600 labor, and $38,400 overhead."]]]]}];
const nav=document.querySelector('#nav'),main=document.querySelector('#main');nav.innerHTML='<strong>Choose an exercise</strong>'+data.map((x,i)=>`<button class="nav" data-index="${i}">${x.name}</button>`).join('');main.innerHTML=data.map((x,i)=>`<section class="panel exercise" id="e-${x.id}"><div class="eyebrow">${x.name}</div><h2>${x.title}</h2><div>${x.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="topic"><b>Relevant slide concept</b><small>${x.source}</small></div><div class="question"><b>Problem facts</b><p>${x.context}</p></div><div class="flow"><span>Problem facts</span><i>→</i><span>Slide rule</span><i>→</i><span>Calculation or entry</span><i>→</i><span>Check answer</span></div>${x.units.map((u,j)=>`<div class="unit" data-unit="${j}"><div class="unit-title">${u[0]}</div><div class="progress"></div><div class="steps"></div><div class="controls"><button class="primary next">Next step</button><button class="secondary reset">Reset</button><button class="secondary all">Show all</button></div></div>`).join('')}</section>`).join('');
let selected=0;function renderUnit(el){const i=Number(el.closest('.exercise').dataset.index),j=Number(el.dataset.unit),u=data[i].units[j],shown=Number(el.dataset.shown||0);el.querySelector('.steps').innerHTML=u[1].slice(0,shown).map(([label,content],k)=>`<div class="step ${k===u[1].length-1?'final':''}"><div class="label">${k+1} · ${label}</div><p>${content}</p></div>`).join('');el.querySelector('.progress').textContent=`${shown} of ${u[1].length} steps revealed`;el.querySelector('.next').disabled=shown>=u[1].length}function select(i){selected=i;document.querySelectorAll('.exercise').forEach((el,k)=>{el.classList.toggle('active',k===i);el.dataset.index=k});document.querySelectorAll('.nav').forEach((el,k)=>el.classList.toggle('active',k===i));history.replaceState(null,'','#'+data[i].id);window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.unit').forEach(el=>{el.closest('.exercise').dataset.index=[...document.querySelectorAll('.exercise')].indexOf(el.closest('.exercise'));el.dataset.shown=0;renderUnit(el);el.querySelector('.next').onclick=()=>{el.dataset.shown=Math.min(data[Number(el.closest('.exercise').dataset.index)].units[Number(el.dataset.unit)][1].length,Number(el.dataset.shown)+1);renderUnit(el)};el.querySelector('.reset').onclick=()=>{el.dataset.shown=0;renderUnit(el)};el.querySelector('.all').onclick=()=>{el.dataset.shown=data[Number(el.closest('.exercise').dataset.index)].units[Number(el.dataset.unit)][1].length;renderUnit(el)}});nav.onclick=e=>{const b=e.target.closest('[data-index]');if(b)select(Number(b.dataset.index))};select(Math.max(0,data.findIndex(x=>'#'+x.id===location.hash)));
</script></body></html>
